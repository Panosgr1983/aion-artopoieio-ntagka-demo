<button id="aion-cf-btn" type="button" aria-haspopup="dialog">✉️ Επικοινωνία</button>
<div id="aion-cf-wrap" role="dialog" aria-modal="true" aria-labelledby="aion-cf-title">
  <div id="aion-cf">
    <h3 id="aion-cf-title">Στείλε αίτημα</h3>
    <p class="sub">Απαντάμε με τηλέφωνο. Χωρίς newsletter, χωρίς spam.</p>
    <form id="aion-cf-form" novalidate>
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <label for="aion-cf-name">Όνομα</label>
      <input id="aion-cf-name" name="name" required autocomplete="name" placeholder="Το όνομά σου">
      <label for="aion-cf-phone">Τηλέφωνο</label>
      <input id="aion-cf-phone" name="phone" required inputmode="tel" autocomplete="tel" placeholder="69…">
      <label for="aion-cf-msg">Τι χρειάζεσαι</label>
      <textarea id="aion-cf-msg" name="message" placeholder="Σύντομα — τι και πότε"></textarea>
      <div class="row"><button class="close" type="button" id="aion-cf-cancel">Κλείσιμο</button><button class="send" type="submit" id="aion-cf-send">Αποστολή</button></div>
      <div class="msg" id="aion-cf-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>
<script>
(function(){
  var ENDPOINT='https://formsubmit.co/ajax/info@aionweb.gr';
  var page=(document.title||'').slice(0,80);
  var wrap=document.getElementById('aion-cf-wrap');
  var btn=document.getElementById('aion-cf-btn');
  var form=document.getElementById('aion-cf-form');
  var statusEl=document.getElementById('aion-cf-status');
  if(!wrap||!btn||!form)return;
  function open(){wrap.classList.add('on');setTimeout(function(){var n=document.getElementById('aion-cf-name');if(n)n.focus();},50);}
  function close(){wrap.classList.remove('on');}
  btn.addEventListener('click',open);
  document.getElementById('aion-cf-cancel').addEventListener('click',close);
  wrap.addEventListener('click',function(e){if(e.target===wrap)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var fd=new FormData(form);
    if(fd.get('_honey'))return;
    var name=(fd.get('name')||'').toString().trim();
    var phone=(fd.get('phone')||'').toString().trim();
    var message=(fd.get('message')||'').toString().trim();
    if(!name||!phone){statusEl.className='msg err';statusEl.textContent='Συμπλήρωσε όνομα και τηλέφωνο.';return;}
    var send=document.getElementById('aion-cf-send');
    send.disabled=true;statusEl.className='msg';statusEl.textContent='Αποστολή…';
    fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:name,phone:phone,message:message,_subject:'Νέο αίτημα — '+page,_template:'table',_captcha:'false'})})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(){form.reset();statusEl.className='ok';statusEl.textContent='Το λάβαμε. Θα σε πάρουμε τηλέφωνο.';setTimeout(close,1600);})
      .catch(function(){statusEl.className='msg err';statusEl.textContent='Δεν στάλθηκε. Δοκίμασε ξανά ή κάλεσέ μας.';})
      .then(function(){send.disabled=false;});
  });
})();
</script>
